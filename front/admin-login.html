<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Tu Dulce Elección</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-login-icon {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .error-message {
            background: #FFE0E0;
            color: #C62828;
            padding: 0.8rem;
            border-radius: 30px;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .info-credenciales {
            background: #FFF0F0;
            padding: 0.8rem;
            border-radius: 20px;
            margin-top: 1rem;
            font-size: 0.75rem;
            text-align: center;
            color: #A8765A;
            border: 1px dashed #FFB8B0;
        }
    </style>
</head>
<body>
    <div class="auth-container" style="max-width: 420px;">
        <a href="index.html" class="back-link">← Volver a la tienda</a>
        
        <div class="admin-login-icon">👑🍰</div>
        <h1 style="text-align: center; color: #E87A5D; font-size: 1.8rem;">Panel Administrador</h1>
        <p style="text-align: center; color: #A8765A; margin-bottom: 2rem;">Ingresá con tus credenciales</p>
        
        <form id="adminLoginForm">
            <div class="form-group">
                <label>📧 Correo electrónico</label>
                <input type="email" id="adminEmail" placeholder="pasteleria@midulce.com" required>
            </div>
            <div class="form-group">
                <label>🔐 Contraseña</label>
                <input type="password" id="adminPassword" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn-primary">Ingresar al Panel</button>
        </form>
        
        <div id="errorMsg" class="error-message"></div>
        
        <div class="info-credenciales">
            🔒 Acceso exclusivo para administradores
        </div>
    </div>

    <script>
        // Credenciales del administrador
        const ADMIN_EMAIL = 'pasteleria@midulce.com';
        const ADMIN_PASSWORD = 'torta2026';
        
        const form = document.getElementById('adminLoginForm');
        const errorMsg = document.getElementById('errorMsg');
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            
            // Limpiar error anterior
            errorMsg.style.display = 'none';
            errorMsg.innerHTML = '';
            
            // Verificar credenciales
            if(email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                // Guardar sesión
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('adminEmail', email);
                
                // Redirigir al panel
                window.location.href = 'admin.html';
            } else {
                // Mostrar error
                errorMsg.innerHTML = '❌ Correo o contraseña incorrectos';
                errorMsg.style.display = 'block';
                
                // Limpiar campo contraseña
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        });
        
        // Si ya está logueado, redirigir directamente
        if(localStorage.getItem('isAdmin') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
