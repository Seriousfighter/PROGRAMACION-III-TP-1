<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu pedido!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .gracias-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #FFF0F0 0%, #FFE4E0 100%);
        }
        
        .gracias-card {
            text-align: center;
            background: #FFF9F5;
            padding: 3rem;
            border-radius: 70px;
            max-width: 550px;
            box-shadow: 0 30px 50px rgba(232, 122, 93, 0.15);
            border: 1px solid #FFD4CC;
        }
        
        .gracias-card h1 {
            color: #E87A5D;
            font-size: 2rem;
            margin: 1.5rem 0;
        }
        
        .gracias-card p {
            color: #A8765A;
            margin: 1rem 0;
        }
        
        .emoji {
            font-size: 4.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FF9B85 0%, #E87A5D 100%);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #E87A5D;
            color: #E87A5D;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
        }
        
        .btn-primary:hover, .btn-outline:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <div class="gracias-card">
            <div class="emoji">🎉🍰✨</div>
            <h1>MUCHAS GRACIAS POR CONFIAR</h1>
            <p>Tu pedido ha sido registrado exitosamente.</p>
            <p>📞 En breve nos pondremos en contacto<br>para coordinar fecha y retiro.</p>
            <div>
                <button class="btn-primary" onclick="location.href='index.html'">Volver al inicio</button>
                <button class="btn-outline" onclick="location.href='cliente.html'">Hacer otro pedido</button>
            </div>
        </div>
    </div>
</body>
</html>
