<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu pedido! - Tu Dulce Elección</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .gracias-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0c3db 0%, #f7d0e0 100%);
        }
        
        .gracias-card {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 70px;
            max-width: 550px;
            box-shadow: 0 30px 50px rgba(254, 57, 185, 0.12);
            border: 1px solid #ffa4c8;
        }
        
        .gracias-card h1 {
            color: #fe39b9;
            font-size: 2rem;
            margin: 1.5rem 0;
        }
        
        .gracias-card p {
            color: #8B5E3C;
            margin: 1rem 0;
        }
        
        .emoji {
            font-size: 4.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fe39b9 0%, #e976a7 100%);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(254, 57, 185, 0.3);
            background: linear-gradient(135deg, #ff6bc9 0%, #fe39b9 100%);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #fe39b9;
            color: #fe39b9;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s;
        }
        
        .btn-outline:hover {
            transform: translateY(-2px);
            background: #fe39b9;
            color: white;
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <div class="gracias-card">
            <div class="emoji">🍰</div>
            <h1>MUCHAS GRACIAS POR CONFIAR</h1>
            <p>Tu pedido ha sido registrado exitosamente.</p>
            <p>📞 En breve nos pondremos en contacto<br>para coordinar fecha y retiro.</p>
            <div>
                <button class="btn-primary" onclick="location.href='index.html'">Volver al inicio</button>
                <button class="btn-outline" onclick="location.href='cliente.html'">Hacer otro pedido</button>
            </div>
        </div>
    </div>
</body>
</html>
