<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar mi torta - Tu Dulce Elección</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .customize-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: #FFF9F5;
            border-radius: 45px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .customize-layout {
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .option-group {
            background: #FFF5F0;
            padding: 1.5rem;
            border-radius: 30px;
            margin-bottom: 1.5rem;
            border: 1px solid #FFE0D8;
        }

        .option-group h3 {
            color: #E87A5D;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .size-options {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .size-options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: white;
            border-radius: 40px;
            border: 1px solid #FFD4CC;
            transition: all 0.2s;
        }

        .size-options label:has(input:checked) {
            background: #FF9B85;
            color: white;
            border-color: #FF9B85;
        }

        .rellenos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .rellenos-grid label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            padding: 0.5rem 0.8rem;
            background: white;
            border-radius: 30px;
            border: 1px solid #FFD4CC;
            transition: all 0.2s;
        }

        .rellenos-grid label:has(input:checked) {
            background: #FFE4E0;
            border-color: #FF9B85;
        }

        select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #FFD4CC;
            border-radius: 40px;
            font-size: 1rem;
            background: white;
            font-family: inherit;
        }

        .selected-panel {
            background: linear-gradient(145deg, #FFF0F0 0%, #FFE8E0 100%);
            padding: 1.8rem;
            border-radius: 35px;
            position: sticky;
            top: 20px;
            border: 1px solid #FFD4CC;
            text-align: center;
        }

        .selected-panel h3 {
            color: #E87A5D;
            margin-bottom: 1.2rem;
        }

        .elegidos-list {
            min-height: 180px;
            margin: 1.2rem 0;
            background: #FFF9F5;
            border-radius: 25px;
            padding: 1rem;
        }

        .elegido-item {
            padding: 0.5rem;
            border-bottom: 1px dashed #FFD4CC;
            color: #A8765A;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF9B85 0%, #E87A5D 100%);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(232, 122, 93, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #E87A5D;
            text-decoration: none;
            font-weight: 600;
        }

        .empty-message {
            color: #D4A594;
            text-align: center;
        }

        @media (max-width: 800px) {
            .customize-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="customize-container">
        <a href="index.html" class="back-link">← Volver</a>
        <h1 style="color: #E87A5D; text-align: center;">🍰 Tu Dulce Elección</h1>
        
        <div class="customize-layout">
            <!-- Columna izquierda: Opciones -->
            <div class="options-panel">
                <div class="option-group">
                    <h3>📏 Tamaño:</h3>
                    <div class="size-options" id="tamaniosContainer">
                        <!-- Los tamaños se cargan dinámicamente -->
                        <p>Cargando tamaños...</p>
                    </div>
                </div>

                <div class="option-group">
                    <h3>🍰 Gustos (Base):</h3>
                    <select id="gustoBase">
                        <option value="Vainilla">Vainilla</option>
                        <option value="Chocolate">Chocolate</option>
                        <option value="Lemon Pie">Lemon Pie</option>
                        <option value="Red Velvet">Red Velvet</option>
                        <option value="Coco">Coco</option>
                        <option value="Dulce de Leche">Dulce de Leche</option>
                    </select>
                </div>

                <div class="option-group">
                    <h3>🥄 RELLENOS:</h3>
                    <div class="rellenos-grid" id="rellenosContainer">
                        <!-- Los rellenos se cargan dinámicamente -->
                        <p>Cargando rellenos...</p>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: Elegidos y confirmar -->
            <div class="selected-panel">
                <h3>✨ Elegidos:</h3>
                <div id="elegidosList" class="elegidos-list">
                    <p class="empty-message">Aún no has seleccionado nada</p>
                </div>
                <button class="btn-primary" id="confirmarPedidoBtn">Confirmar Pedido 🎂</button>
            </div>
        </div>
    </div>
    
    <script>
        // ========== CARGAR DATOS DESDE LOCALSTORAGE ==========
        function cargarTamanios() {
            const container = document.getElementById('tamaniosContainer');
            if(!container) return;
            
            // Obtener tamaños del localStorage (los que admin gestiona)
            let tamanios = JSON.parse(localStorage.getItem('tamanios'));
            
            // Si no hay datos en localStorage, usar valores por defecto
            if(!tamanios || tamanios.length === 0) {
                tamanios = [
                    { nombre: "Chica", precio: 1800 },
                    { nombre: "Mediana", precio: 2500 },
                    { nombre: "Grande", precio: 3500 }
                ];
                localStorage.setItem('tamanios', JSON.stringify(tamanios));
            }
            
            // Generar HTML de tamaños
            container.innerHTML = tamanios.map(tam => `
                <label>
                    <input type="radio" name="tamanio" value="${tam.nombre}" data-precio="${tam.precio}">
                    ${tam.nombre}
                </label>
            `).join('');
            
            // Agregar eventos a los radios
            document.querySelectorAll('input[name="tamanio"]').forEach(radio => {
                radio.addEventListener('change', actualizarElegidos);
            });
        }
        
        function cargarIngredientes() {
            const container = document.getElementById('rellenosContainer');
            if(!container) return;
            
            // Obtener ingredientes del localStorage (los que admin gestiona)
            let ingredientes = JSON.parse(localStorage.getItem('ingredientes'));
            
            // Si no hay datos en localStorage, usar valores por defecto
            if(!ingredientes || ingredientes.length === 0) {
                ingredientes = [
                    "Dulce de Leche", "Frutilla", "Mantecol", "Bon o Bon", 
                    "Kinder", "Nutella", "Oreo", "Pistacho"
                ];
                localStorage.setItem('ingredientes', JSON.stringify(ingredientes));
            }
            
            // Generar HTML de rellenos
            container.innerHTML = ingredientes.map(ing => `
                <label>
                    <input type="checkbox" value="${ing}"> ${ing}
                </label>
            `).join('');
            
            // Agregar eventos a los checkboxes
            document.querySelectorAll('#rellenosContainer input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', actualizarElegidos);
            });
        }
        
        // ========== ACTUALIZAR LISTA DE ELEGIDOS ==========
        function actualizarElegidos() {
            const elegidosDiv = document.getElementById('elegidosList');
            if(!elegidosDiv) return;
            
            let seleccionados = [];
            
            // Tamaño seleccionado
            const tamanioSeleccionado = document.querySelector('input[name="tamanio"]:checked');
            if(tamanioSeleccionado) {
                seleccionados.push(`📏 Tamaño: ${tamanioSeleccionado.value}`);
            }
            
            // Gusto base
            const gustoSelect = document.getElementById('gustoBase');
            if(gustoSelect && gustoSelect.value) {
                seleccionados.push(`🍰 Base: ${gustoSelect.value}`);
            }
            
            // Rellenos seleccionados
            const rellenosSeleccionados = Array.from(document.querySelectorAll('#rellenosContainer input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            
            rellenosSeleccionados.forEach(relleno => {
                seleccionados.push(`🥄 ${relleno}`);
            });
            
            // Mostrar en el panel
            if(seleccionados.length === 0) {
                elegidosDiv.innerHTML = '<p class="empty-message">✨ Elegí los ingredientes de tu torta ✨</p>';
            } else {
                elegidosDiv.innerHTML = seleccionados.map(s => `<div class="elegido-item">❤️ ${s}</div>`).join('');
            }
        }
        
        // ========== CALCULAR TOTAL ==========
        function calcularTotal() {
            // Obtener precio del tamaño seleccionado
            const tamanioSeleccionado = document.querySelector('input[name="tamanio"]:checked');
            let precioBase = 0;
            
            if(tamanioSeleccionado) {
                const tamanios = JSON.parse(localStorage.getItem('tamanios')) || [];
                const tamanioEncontrado = tamanios.find(t => t.nombre === tamanioSeleccionado.value);
                precioBase = tamanioEncontrado ? tamanioEncontrado.precio : 2000;
            }
            
            // Contar rellenos seleccionados
            const rellenosSeleccionados = document.querySelectorAll('#rellenosContainer input[type="checkbox"]:checked').length;
            const extraPorRelleno = 250;
            
            return precioBase + (rellenosSeleccionados * extraPorRelleno);
        }
        
        // ========== CONFIRMAR PEDIDO ==========
        function confirmarPedido() {
            const tamanioSeleccionado = document.querySelector('input[name="tamanio"]:checked');
            
            if(!tamanioSeleccionado) {
                alert('🍰 Por favor, seleccioná el tamaño de tu torta');
                return;
            }
            
            const gusto = document.getElementById('gustoBase').value;
            const rellenos = Array.from(document.querySelectorAll('#rellenosContainer input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            const total = calcularTotal();
            
            // Obtener nombre del cliente (podés pedirlo)
            let clienteNombre = localStorage.getItem('clienteNombre');
            if(!clienteNombre) {
                clienteNombre = prompt('📝 Ingresá tu nombre para el pedido:', 'Cliente');
                if(clienteNombre) {
                    localStorage.setItem('clienteNombre', clienteNombre);
                } else {
                    clienteNombre = 'Cliente';
                }
            }
            
            const pedido = {
                id: Date.now(),
                cliente: clienteNombre,
                tamanio: tamanioSeleccionado.value,
                gusto: gusto,
                rellenos: rellenos,
                total: total,
                fecha: new Date().toLocaleString(),
                estado: 'Pendiente'
            };
            
            // Guardar pedido
            let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
            pedidos.unshift(pedido); // Agregar al principio
            localStorage.setItem('pedidos', JSON.stringify(pedidos));
            
            // Guardar pedido temporal para el resumen
            localStorage.setItem('pedidoTemp', JSON.stringify(pedido));
            
            alert(`✅ ¡Pedido confirmado!\nTotal: $${total.toLocaleString()}\nEn breve nos contactamos.`);
            window.location.href = 'gracias.html';
        }
        
        // ========== INICIALIZAR ==========
        document.addEventListener('DOMContentLoaded', () => {
            cargarTamanios();
            cargarIngredientes();
            
            // Eventos adicionales
            const gustoSelect = document.getElementById('gustoBase');
            if(gustoSelect) {
                gustoSelect.addEventListener('change', actualizarElegidos);
            }
            
            const confirmarBtn = document.getElementById('confirmarPedidoBtn');
            if(confirmarBtn) {
                confirmarBtn.addEventListener('click', confirmarPedido);
            }
        });
    </script>
</body>
</html>
